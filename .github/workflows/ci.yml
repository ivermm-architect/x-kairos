name: CI

# Required gate for merging into main: every PR must install, lint,
# type-check and build before it can land. Test execution is out of scope
# here (no harness yet — see M6).
on:
  pull_request:
    branches: [main]

# Cancel superseded runs on the same PR to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # ESLint ignores formatting (eslint-config-prettier), so Prettier must
      # gate it: catches unformatted code that skipped the local pre-commit hook.
      - name: Format check
        run: npm run format:check

      # Build first: Next generates its global helper types (LayoutProps,
      # PageProps, ...) into .next/types, which the standalone type-check needs.
      #
      # The static export prerenders every page at build time, including the
      # admin shell wrapped in <AuthProvider>, which constructs the Supabase
      # browser client. Only NEXT_PUBLIC_* (non-secret, build-time) vars are
      # needed and placeholders suffice: the client just constructs here — its
      # network calls live in effects that run only in the browser.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

      - name: Type-check
        run: npx tsc --noEmit
