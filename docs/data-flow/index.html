<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>x-kairos · data-flow viewer</title>
    <link rel="stylesheet" href="styles/flow.css" />
  </head>
  <body>
    <header>
      <h1>x-kairos · data flow</h1>
      <span class="meta" id="meta"></span>
      <div class="controls">
        <input
          id="search"
          type="search"
          placeholder="Search operation / table…"
          aria-label="Search operations and tables"
        />
        <a class="link" href="../er-viewer/index.html">ER viewer →</a>
      </div>
    </header>

    <div id="main">
      <section class="lane" id="lane-surfaces" aria-label="Client surfaces">
        <h2 class="lane-title">Client</h2>
        <div class="lane-body" id="surfaces"></div>
      </section>

      <section class="lane lane-ops" id="lane-ops" aria-label="Supabase operations">
        <h2 class="lane-title">Supabase · operations</h2>
        <div class="lane-body" id="ops"></div>
      </section>

      <section class="lane" id="lane-tables" aria-label="Tables written">
        <h2 class="lane-title">Tables</h2>
        <div class="lane-body" id="tables"></div>
      </section>

      <aside id="detail">
        <p class="placeholder">
          Click an operation to see its RPC, guards, tables and triggers — or click a table to see
          which operations write it.
        </p>
      </aside>
    </div>

    <div id="empty">
      <h2>No flows yet</h2>
      <p><code>flows.js</code> has no operations. Curate the dataset and reload.</p>
    </div>

    <!-- Curated dataset (hand-maintained from the migrations). -->
    <script src="flows.js"></script>
    <!-- Viewer (plain globals so it runs from file:// without a bundler). -->
    <script src="src/flow.js"></script>
  </body>
</html>
