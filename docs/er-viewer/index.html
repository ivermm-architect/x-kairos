<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>x-kairos · ER viewer</title>
    <!-- Graph engine (pinned to major 3, no exact patch guessed). -->
    <script src="https://unpkg.com/cytoscape@3/dist/cytoscape.min.js"></script>
    <!-- Minimap / bird's-eye navigator (no jQuery needed in v2). -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/cytoscape-navigator@2.0.1/cytoscape.js-navigator.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/cytoscape-navigator@2.0.1/cytoscape-navigator.js"></script>
    <!-- Auto-generated schema data (pure DB dump). -->
    <script src="schema.js"></script>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --border: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #58a6ff;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.5 ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 10px 16px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }
      header h1 {
        font-size: 15px;
        margin: 0;
        font-weight: 600;
      }
      header .meta {
        color: var(--muted);
        font-size: 12px;
      }
      header .legend {
        margin-left: auto;
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        font-size: 12px;
        color: var(--muted);
      }
      header .legend .item .dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        margin-right: 5px;
        vertical-align: middle;
      }
      .controls {
        display: flex;
        gap: 6px;
      }
      .controls .zoom {
        font-weight: 700;
        min-width: 30px;
      }
      #minimap {
        position: fixed;
        left: 14px;
        bottom: 14px;
        width: 230px;
        height: 160px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        z-index: 5;
      }
      .cytoscape-navigatorView {
        background: rgba(88, 166, 255, 0.25);
        border: 1px solid var(--accent);
      }
      button {
        background: #21262d;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 5px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      #main {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      #cy {
        flex: 1;
        height: 100%;
      }
      #detail {
        width: 320px;
        flex: none;
        background: var(--panel);
        border-left: 1px solid var(--border);
        overflow-y: auto;
        padding: 16px;
      }
      #detail .placeholder {
        color: var(--muted);
        font-size: 13px;
      }
      #detail h2 {
        margin: 0;
        font-size: 16px;
      }
      #detail .sub {
        color: var(--muted);
        font-size: 12px;
        margin: 2px 0 10px;
      }
      #detail .desc {
        font-size: 13px;
        color: var(--text);
        margin: 0 0 14px;
      }
      #detail h3 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin: 14px 0 6px;
      }
      #detail .col {
        padding: 8px 0;
        border-top: 1px solid var(--border);
      }
      #detail .col .name {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 13px;
      }
      #detail .col .ctype {
        color: var(--muted);
        font-size: 12px;
        margin-left: 4px;
      }
      #detail .col .cdesc {
        font-size: 12px;
        color: var(--muted);
        margin-top: 3px;
      }
      #detail .rel {
        font-size: 12px;
        margin: 4px 0;
      }
      #detail .rel code {
        color: var(--accent);
      }
      .chip {
        display: inline-block;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.03em;
        padding: 1px 6px;
        border-radius: 999px;
        margin-left: 6px;
        vertical-align: middle;
        border: 1px solid transparent;
      }
      .chip.pk {
        color: #f2cc60;
        border-color: #f2cc60;
      }
      .chip.fk {
        color: #7ee787;
        border-color: #7ee787;
      }
      .chip.nn {
        color: #ff7b72;
        border-color: #ff7b72;
      }
      #empty {
        flex: 1;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: var(--muted);
        padding: 24px;
      }
      #empty code {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 2px 6px;
        color: var(--accent);
      }
      #empty h2 {
        color: var(--text);
        margin: 0 0 8px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>x-kairos · ER</h1>
      <span class="meta" id="meta"></span>
      <div class="controls">
        <button class="zoom" id="zoomOut" title="Zoom out">−</button>
        <button class="zoom" id="zoomIn" title="Zoom in">+</button>
        <button id="fit">Fit</button>
        <button id="relayout">Re-layout</button>
      </div>
      <div class="legend" id="legend"></div>
    </header>

    <div id="main">
      <div id="cy"></div>
      <aside id="detail">
        <p class="placeholder">Click a table to see its columns and relations.</p>
      </aside>
    </div>
    <div id="minimap"></div>
    <div id="empty">
      <h2>No tables yet</h2>
      <p>
        The database is empty or <code>schema.js</code> has not been generated.<br />
        Run the introspection query and regenerate — see <code>README.md</code>.
      </p>
    </div>

    <script>
      // ---- Phase grouping (manual metadata; NOT part of the DB dump) ----------
      // Each table belongs to a build phase. Colors come from the phase, so the
      // diagram shows at a glance which module each table belongs to. Add table
      // names here as new phases land.
      var PHASES = {
        0: { milestone: "M0", label: "Foundation", color: "#58a6ff" },
        1: { milestone: "M1", label: "Catalog", color: "#7ee787" },
        2: { milestone: "M2", label: "Inventory", color: "#d2a8ff" },
        3: { milestone: "M3", label: "Sales / POS", color: "#ffa657" },
        4: { milestone: "M4", label: "Cash", color: "#f2cc60" },
        5: { milestone: "M5", label: "Web public", color: "#ff7b72" },
      };
      var TABLE_PHASE = {
        staff: 0,
        roles: 0,
        staff_roles: 0,
        measurement_units: 1,
        categories: 1,
        brands: 1,
        products: 1,
        product_images: 1,
        product_units: 1,
        product_price_tiers: 1,
        warehouses: 2,
        warehouse_locations: 2,
        stock_entries: 2,
        stock_entry_items: 2,
        warehouse_stock: 2,
        inventory_movements: 2,
        transfers: 2,
        transfer_items: 2,
        transfer_lots: 2,
        clients: 3,
        cash_registers: 3,
        cash_sessions: 3,
        quotations: 3,
        sales: 3,
        sale_items: 3,
        sale_payments: 3,
        credit_payments: 3,
        cash_movements: 3,
        quotation_items: 3,
        returns: 3,
        return_items: 3,
      };
      var UNASSIGNED = {
        milestone: "—",
        label: "Unassigned",
        color: "#8b949e",
      };

      // Literal colors — Cytoscape runs on canvas and does NOT read CSS vars.
      var C = {
        bg: "#0d1117",
        panel: "#161b22",
        text: "#e6edf3",
        muted: "#8b949e",
        edge: "#8b949e",
        accent: "#58a6ff",
      };

      (function () {
        var schema = window.__SCHEMA__;
        var meta = document.getElementById("meta");
        var legend = document.getElementById("legend");
        var cyEl = document.getElementById("cy");
        var emptyEl = document.getElementById("empty");

        var mainEl = document.getElementById("main");
        var detailEl = document.getElementById("detail");

        if (!schema || !Array.isArray(schema.tables) || schema.tables.length === 0) {
          mainEl.style.display = "none";
          emptyEl.style.display = "flex";
          if (schema && schema.generated_at)
            meta.textContent = "generated " + schema.generated_at + " · empty";
          return;
        }

        var byName = {};
        schema.tables.forEach(function (t) {
          byName[t.name] = t;
        });

        meta.textContent =
          "generated " +
          (schema.generated_at || "?") +
          " · " +
          schema.tables.length +
          " tables · " +
          (schema.relations || []).length +
          " relations";

        function phaseOf(name) {
          return TABLE_PHASE.hasOwnProperty(name) ? PHASES[TABLE_PHASE[name]] : UNASSIGNED;
        }

        // Legend: only phases actually present on screen.
        var present = {};
        schema.tables.forEach(function (t) {
          var p = TABLE_PHASE.hasOwnProperty(t.name) ? TABLE_PHASE[t.name] : "_";
          present[p] = true;
        });
        Object.keys(present).forEach(function (k) {
          var p = k === "_" ? UNASSIGNED : PHASES[k];
          if (!p) return;
          var el = document.createElement("span");
          el.className = "item";
          el.innerHTML =
            '<span class="dot" style="background:' +
            p.color +
            '"></span>' +
            '<strong style="color:' +
            p.color +
            '">' +
            p.milestone +
            "</strong> · " +
            p.label;
          legend.appendChild(el);
        });

        // Columns are left-aligned (text-justification:left); the table name is
        // centered by padding it with spaces to the widest row (monospace font).
        function label(t) {
          var p = phaseOf(t.name);
          var rows = t.columns.map(function (c) {
            var mark = c.pk ? "🔑" : c.fk ? "🔗" : "  ";
            return mark + " " + c.name + " : " + c.type;
          });
          var title = p.milestone + "  " + t.name;
          var width = rows.reduce(function (m, r) {
            return Math.max(m, r.length);
          }, title.length);
          var pad = Math.max(0, Math.floor((width - title.length) / 2));
          var sep = "─".repeat(width);
          return [new Array(pad + 1).join(" ") + title, sep].concat(rows).join("\n");
        }

        // ---- Deterministic block layout --------------------------------------
        // cose is force-directed and seeded at random, so the map was tangled
        // and different on every load. Instead each phase becomes a labelled
        // compound block and its tables sit on a fixed grid, so the diagram is
        // stable and reads by milestone. Positions are computed here; the
        // Cytoscape layout is 'preset' (it just honours these positions).
        var COLS_IN_BLOCK = 2; // tables per row inside a block
        var CELL_W = 400,
          CELL_H = 260; // spacing between table nodes (labels are large)
        var BLOCK_GAP_X = 160,
          BLOCK_GAP_Y = 200,
          BLOCKS_PER_ROW = 3;

        var grouped = {};
        schema.tables.forEach(function (t) {
          var k = TABLE_PHASE.hasOwnProperty(t.name) ? TABLE_PHASE[t.name] : "_";
          (grouped[k] = grouped[k] || []).push(t.name);
        });
        Object.keys(grouped).forEach(function (k) {
          grouped[k].sort();
        });
        // Draw phases in milestone order; unassigned last.
        var order = Object.keys(PHASES)
          .map(Number)
          .sort(function (a, b) {
            return a - b;
          })
          .filter(function (k) {
            return grouped[k];
          });
        if (grouped["_"]) order.push("_");

        var positions = {};
        var parentOf = {};
        var parentNodes = [];
        var cursorX = 0,
          cursorY = 0,
          rowMaxH = 0,
          inRow = 0;
        order.forEach(function (k) {
          var tables = grouped[k];
          var cols = Math.min(COLS_IN_BLOCK, tables.length);
          var rows = Math.ceil(tables.length / cols);
          var pid = "phase_" + k;
          var p = k === "_" ? UNASSIGNED : PHASES[k];
          parentNodes.push({
            data: { id: pid, label: p.milestone + " · " + p.label, color: p.color, isPhase: 1 },
          });
          tables.forEach(function (name, i) {
            positions[name] = {
              x: cursorX + (i % cols) * CELL_W,
              y: cursorY + Math.floor(i / cols) * CELL_H,
            };
            parentOf[name] = pid;
          });
          rowMaxH = Math.max(rowMaxH, rows * CELL_H);
          cursorX += cols * CELL_W + BLOCK_GAP_X;
          if (++inRow >= BLOCKS_PER_ROW) {
            inRow = 0;
            cursorX = 0;
            cursorY += rowMaxH + BLOCK_GAP_Y;
            rowMaxH = 0;
          }
        });

        var elements = [];
        parentNodes.forEach(function (pn) {
          elements.push(pn);
        });
        schema.tables.forEach(function (t) {
          elements.push({
            data: {
              id: t.name,
              label: label(t),
              color: phaseOf(t.name).color,
              parent: parentOf[t.name],
            },
            position: positions[t.name],
          });
        });
        (schema.relations || []).forEach(function (r, i) {
          elements.push({
            data: {
              id: "e" + i,
              source: r.source_table,
              target: r.target_table,
              label: r.source_column + " → " + r.target_column,
            },
          });
        });

        var cy = cytoscape({
          container: cyEl,
          elements: elements,
          wheelSensitivity: 0.2,
          style: [
            {
              selector: ":parent",
              style: {
                shape: "round-rectangle",
                "background-color": "data(color)",
                "background-opacity": 0.05,
                "border-width": 2,
                "border-color": "data(color)",
                "border-opacity": 0.45,
                label: "data(label)",
                color: "data(color)",
                "text-valign": "top",
                "text-halign": "center",
                "text-margin-y": -8,
                "font-family": "ui-monospace, SFMono-Regular, Menlo, monospace",
                "font-size": 22,
                "font-weight": 700,
                padding: "30px",
              },
            },
            {
              selector: "node:childless",
              style: {
                shape: "round-rectangle",
                "background-color": "data(color)",
                "background-opacity": 0.12,
                "border-width": 2,
                "border-color": "data(color)",
                label: "data(label)",
                color: C.text,
                "text-valign": "center",
                "text-halign": "center",
                "text-justification": "left",
                "text-wrap": "wrap",
                "font-family": "ui-monospace, SFMono-Regular, Menlo, monospace",
                "font-size": 11,
                padding: "12px",
                width: "label",
                height: "label",
              },
            },
            {
              selector: "node:childless:selected",
              style: { "border-width": 4, "background-opacity": 0.25 },
            },
            {
              selector: "edge",
              style: {
                width: 1.5,
                "line-color": C.edge,
                "target-arrow-color": C.edge,
                "target-arrow-shape": "triangle",
                "curve-style": "bezier",
                label: "data(label)",
                "font-family": "ui-monospace, SFMono-Regular, Menlo, monospace",
                "font-size": 9,
                color: C.text,
                "text-background-color": C.panel,
                "text-background-opacity": 0.9,
                "text-background-shape": "round-rectangle",
                "text-background-padding": 3,
                // Cardinality: N on the FK side (source), 1 on the PK side (target).
                "source-label": "N",
                "target-label": "1",
                "source-text-offset": 18,
                "target-text-offset": 22,
                "source-text-margin-y": -6,
                "target-text-margin-y": -6,
                "font-weight": 700,
              },
            },
            { selector: ".faded", style: { opacity: 0.12 } },
            {
              selector: ".highlight",
              style: {
                "line-color": C.accent,
                "target-arrow-color": C.accent,
                width: 2.5,
                color: C.accent,
              },
            },
            {
              selector: "node:childless.highlight",
              style: {
                "border-width": 3,
                "border-color": C.accent,
                "outline-width": 4,
                "outline-color": C.accent,
                "outline-opacity": 0.9,
                "outline-offset": 2,
              },
            },
          ],
          layout: { name: "preset", fit: true, padding: 50 },
        });

        function esc(s) {
          return String(s == null ? "" : s).replace(/[&<>]/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c];
          });
        }

        var relations = schema.relations || [];
        function renderDetail(name) {
          var t = byName[name];
          if (!t) return;
          var p = phaseOf(name);
          var html = "<h2>" + esc(t.name) + "</h2>";
          html +=
            '<div class="sub">' +
            p.milestone +
            " · " +
            esc(p.label) +
            " · " +
            t.columns.length +
            " columns</div>";
          if (t.description) html += '<p class="desc">' + esc(t.description) + "</p>";

          html += "<h3>Columns</h3>";
          t.columns.forEach(function (c) {
            var chips = "";
            if (c.pk) chips += '<span class="chip pk">PK</span>';
            if (c.fk) chips += '<span class="chip fk">FK</span>';
            if (!c.nullable) chips += '<span class="chip nn">NOT NULL</span>';
            html +=
              '<div class="col"><span class="name">' +
              esc(c.name) +
              "</span>" +
              '<span class="ctype">: ' +
              esc(c.type) +
              "</span>" +
              chips +
              (c.description ? '<div class="cdesc">' + esc(c.description) + "</div>" : "") +
              "</div>";
          });

          var out = relations.filter(function (r) {
            return r.source_table === name;
          });
          var inc = relations.filter(function (r) {
            return r.target_table === name;
          });
          if (out.length || inc.length) {
            html += "<h3>Relations</h3>";
            out.forEach(function (r) {
              html +=
                '<div class="rel"><strong>N:1</strong> → <code>' +
                esc(r.target_table) +
                "</code> " +
                '<span class="ctype">(' +
                esc(r.source_column) +
                " → " +
                esc(r.target_column) +
                ")</span></div>";
            });
            inc.forEach(function (r) {
              html +=
                '<div class="rel"><strong>1:N</strong> ← <code>' +
                esc(r.source_table) +
                "</code> " +
                '<span class="ctype">(' +
                esc(r.source_table) +
                "." +
                esc(r.source_column) +
                " → " +
                esc(r.target_column) +
                ")</span></div>";
            });
          }
          detailEl.innerHTML = html;
        }

        function renderBlockDetail(parent) {
          var kids = parent.children();
          var html = "<h2>" + esc(parent.data("label")) + "</h2>";
          html += '<div class="sub">' + kids.length + " tables</div>";
          html += "<h3>Tables</h3>";
          kids
            .map(function (k) {
              return k.id();
            })
            .sort()
            .forEach(function (id) {
              html += '<div class="rel"><code>' + esc(id) + "</code></div>";
            });
          detailEl.innerHTML = html;
        }

        // Tap a table: highlight it + its direct relations and fill the panel.
        // Tap a phase block: highlight every table in it + their relations.
        cy.on("tap", "node", function (evt) {
          var n = evt.target;
          cy.elements().addClass("faded");
          if (n.data("isPhase")) {
            var hood = n.children();
            n.children().forEach(function (k) {
              hood = hood.union(k.closedNeighborhood());
            });
            hood.removeClass("faded");
            hood.edges().addClass("highlight");
            hood.nodes(":childless").addClass("highlight");
            n.removeClass("faded");
            renderBlockDetail(n);
          } else {
            var nb = n.closedNeighborhood();
            nb.removeClass("faded");
            nb.edges().addClass("highlight");
            nb.nodes(":childless").addClass("highlight");
            n.parent().removeClass("faded");
            renderDetail(n.id());
          }
        });
        cy.on("tap", function (evt) {
          if (evt.target === cy) {
            cy.elements().removeClass("faded").removeClass("highlight");
            detailEl.innerHTML =
              '<p class="placeholder">Click a table to see its columns and relations.</p>';
          }
        });

        function zoomBy(factor) {
          cy.zoom({
            level: cy.zoom() * factor,
            renderedPosition: {
              x: cyEl.clientWidth / 2,
              y: cyEl.clientHeight / 2,
            },
          });
        }
        document.getElementById("zoomIn").onclick = function () {
          zoomBy(1.2);
        };
        document.getElementById("zoomOut").onclick = function () {
          zoomBy(1 / 1.2);
        };
        document.getElementById("fit").onclick = function () {
          cy.fit(50);
        };
        document.getElementById("relayout").onclick = function () {
          cy.layout({ name: "preset", positions: positions, fit: true, padding: 50 }).run();
        };

        // Minimap — only if the navigator extension loaded (CDN guard).
        if (typeof cy.navigator === "function") {
          cy.navigator({ container: "#minimap", viewLiveFramerate: 0 });
        } else {
          document.getElementById("minimap").style.display = "none";
        }
      })();
    </script>
  </body>
</html>
