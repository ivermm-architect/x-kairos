<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>x-kairos · ER viewer</title>
    <!-- Graph engine (pinned to major 3, no exact patch guessed). -->
    <script src="https://unpkg.com/cytoscape@3/dist/cytoscape.min.js"></script>
    <!-- Minimap / bird's-eye navigator (no jQuery needed in v2). -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/cytoscape-navigator@2.0.1/cytoscape.js-navigator.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/cytoscape-navigator@2.0.1/cytoscape-navigator.js"></script>
    <link rel="stylesheet" href="styles/viewer.css" />
  </head>
  <body>
    <header>
      <h1>x-kairos · ER</h1>
      <span class="meta" id="meta"></span>
      <div class="controls">
        <button class="zoom" id="zoomOut" title="Zoom out">−</button>
        <button class="zoom" id="zoomIn" title="Zoom in">+</button>
        <button id="fit">Fit</button>
        <button id="relayout">Re-layout</button>
      </div>
      <div class="legend" id="legend"></div>
    </header>

    <div id="main">
      <div id="stage">
        <div id="cy"></div>
        <div id="overlay"></div>
      </div>
      <aside id="detail">
        <p class="placeholder">Click a table to see its columns and relations.</p>
      </aside>
    </div>
    <div id="minimap"></div>
    <div id="empty">
      <h2>No tables yet</h2>
      <p>
        The database is empty or <code>schema.js</code> has not been generated.<br />
        Run the introspection query and regenerate — see <code>README.md</code>.
      </p>
    </div>

    <!-- Auto-generated schema data (pure DB dump). -->
    <script src="schema.js"></script>
    <!-- Viewer modules (plain globals so it runs from file:// without a bundler). -->
    <script src="src/phases.js"></script>
    <script src="src/layout.js"></script>
    <script src="src/cards.js"></script>
    <script src="src/detail.js"></script>
    <script src="src/viewer.js"></script>
  </body>
</html>
